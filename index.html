<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>vtierlist — Minecraft PvP Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#080d0a;--bg2:#0d1510;--bg3:#111a14;
  --border:rgba(74,222,128,.08);--border2:rgba(74,222,128,.18);
  --green:#4ade80;--green2:#16a34a;--glow:rgba(74,222,128,.3);
  --text:#f0fdf4;--muted:#4b5563;--dim:#1f2937;
  --red:#ef4444;--yellow:#f59e0b;--blue:#3b82f6;
}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;top:-300px;left:50%;transform:translateX(-50%);width:900px;height:500px;background:radial-gradient(ellipse,rgba(74,222,128,.05) 0%,transparent 65%);pointer-events:none;z-index:0}

/* HEADER */
header{position:sticky;top:0;z-index:100;background:rgba(8,13,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.hdr{max-width:1000px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:10px}
.logo{display:flex;align-items:center;gap:8px;text-decoration:none;margin-right:4px}
.logo-icon{width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--green),var(--green2));box-shadow:0 0 16px var(--glow);display:flex;align-items:center;justify-content:center;flex-shrink:0;animation:slimepulse 3s ease-in-out infinite}
@keyframes slimepulse{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.06)}}
.logo-text{font-weight:800;font-size:15px;color:var(--text)}
.btn-pill{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--border2);background:rgba(74,222,128,.08);color:var(--green);cursor:pointer}
.spacer{flex:1}
.hdr-auth{display:flex;align-items:center;gap:8px}
.btn-ghost{font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;border:none;background:none;color:var(--muted);cursor:pointer;display:flex;align-items:center;gap:5px;transition:color .15s}
.btn-ghost:hover{color:var(--text)}
.btn-primary{font-size:12px;font-weight:700;padding:6px 12px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--green),var(--green2));color:#052e16;cursor:pointer;display:flex;align-items:center;gap:5px;box-shadow:0 0 14px var(--glow);transition:opacity .15s}
.btn-primary:hover{opacity:.9}
.btn-admin{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid rgba(74,222,128,.2);background:rgba(74,222,128,.08);color:var(--green);cursor:pointer;display:flex;align-items:center;gap:5px}
.user-chip{display:flex;align-items:center;gap:6px;padding-left:10px;border-left:1px solid rgba(255,255,255,.07)}
.user-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));color:#052e16;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center}
.user-name{font-size:13px;font-weight:500;color:#86efac}
@media(max-width:480px){.user-name{display:none}}

/* MAIN */
main{max-width:1000px;margin:0 auto;padding:32px 16px 48px;position:relative;z-index:1}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--text);margin-bottom:4px}
.subtitle{font-size:13px;color:var(--muted);margin-bottom:28px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:28px}
@media(max-width:600px){.stats-grid{grid-template-columns:1fr}}
.stat-card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:18px}
.stat-label{font-size:12px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:6px;margin-bottom:8px}
.stat-val{font-size:38px;font-weight:800;color:var(--text)}
.region-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.region-chip{font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px}

/* TABS + FILTER */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1}
.tab{font-size:12px;font-weight:600;padding:6px 12px;border-radius:8px;border:none;background:transparent;color:var(--muted);cursor:pointer;transition:all .15s}
.tab:hover{color:#9ca3af}
.tab.active{background:linear-gradient(135deg,var(--green),var(--green2));color:#052e16;box-shadow:0 0 12px var(--glow)}
.filter-row{display:flex;align-items:center;gap:6px}
.search-wrap{position:relative}
.search-wrap svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--dim);pointer-events:none}
.search-input{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:6px 12px 6px 30px;font-size:12px;color:var(--text);width:160px;outline:none;transition:border-color .15s}
.search-input::placeholder{color:var(--muted)}
.search-input:focus{border-color:rgba(74,222,128,.4)}
.dropdown{position:relative}
.dropdown-btn{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;font-size:12px;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.dropdown-menu{position:absolute;right:0;top:calc(100% + 4px);background:var(--bg2);border:1px solid var(--border2);border-radius:12px;min-width:130px;overflow:hidden;z-index:50;box-shadow:0 20px 40px rgba(0,0,0,.5)}
.dropdown-item{display:block;width:100%;text-align:left;padding:10px 14px;font-size:12px;color:#9ca3af;border:none;background:none;cursor:pointer;transition:background .1s}
.dropdown-item:hover{background:rgba(255,255,255,.04)}
.dropdown-item.sel{color:var(--green)}

/* PLAYER CARDS */
.card-list{display:flex;flex-direction:column;gap:10px}
.player-card{background:#0f1319;border:1px solid rgba(255,255,255,.05);border-radius:16px;padding:18px;transition:border-color .15s}
.player-card:hover{border-color:rgba(74,222,128,.15)}
.card-top{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.rank-badge{width:58px;height:58px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;font-weight:900;font-size:18px;color:#fff}
.rank-1{background:linear-gradient(135deg,#f59e0b,#d97706);box-shadow:0 0 18px rgba(245,158,11,.35)}
.rank-2{background:linear-gradient(135deg,#94a3b8,#64748b)}
.rank-3{background:linear-gradient(135deg,#f97316,#c2410c)}
.rank-n{background:var(--bg2);border:1px solid rgba(255,255,255,.08);color:#6b7280}
.avatar-wrap{width:58px;height:58px;border-radius:12px;overflow:hidden;flex-shrink:0;position:relative;border:2px solid rgba(74,222,128,.2);image-rendering:pixelated}
.avatar-wrap img{width:100%;height:100%;object-fit:cover;image-rendering:pixelated;position:relative;z-index:2}
.avatar-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#fff;z-index:1}
.player-info{flex:1;min-width:0}
.player-name{font-size:17px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.player-meta{display:flex;align-items:center;gap:8px;margin-top:4px;flex-wrap:wrap}
.player-pts{font-size:13px;font-weight:700;color:var(--green)}
.player-sep{color:var(--dim);font-size:12px}
.player-title{font-size:12px;font-weight:600}
.badges-row{display:flex;gap:10px;flex-wrap:wrap}
.gm-badge{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:44px}
.gm-label{font-size:9px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.tier-pill{font-size:10px;font-weight:800;padding:2px 6px;border-radius:4px;color:#fff;min-width:30px;text-align:center}
.tier-empty{font-size:11px;color:var(--dim);font-weight:600}

/* EMPTY STATE */
.empty{text-align:center;padding:80px 20px}
.empty-icon{font-size:48px;margin-bottom:14px}
.empty-text{color:var(--muted);font-weight:500;font-size:14px}
.empty-link{color:var(--green);font-size:13px;background:none;border:none;cursor:pointer;text-decoration:underline;margin-top:10px;display:inline-block}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(10px);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px}
.modal{background:var(--bg);border:1px solid rgba(74,222,128,.15);border-radius:20px;padding:32px;width:100%;max-width:380px;position:relative;box-shadow:0 0 60px rgba(74,222,128,.07)}
.modal-close{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--dim);cursor:pointer;font-size:18px;line-height:1;padding:4px}
.modal-close:hover{color:#9ca3af}
.modal-logo{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.mode-toggle{display:flex;background:var(--bg2);border-radius:12px;padding:4px;gap:0;margin-bottom:22px}
.mode-btn{flex:1;padding:8px;border-radius:8px;border:none;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;background:transparent;color:var(--muted)}
.mode-btn.active{background:linear-gradient(135deg,var(--green),var(--green2));color:#052e16;box-shadow:0 2px 8px var(--glow)}
.form-group{margin-bottom:14px}
.form-label{font-size:11px;font-weight:500;color:var(--muted);display:block;margin-bottom:6px}
.form-input{width:100%;background:var(--bg2);border:1px solid rgba(74,222,128,.1);border-radius:12px;padding:12px 14px;font-size:13px;color:var(--text);outline:none;font-family:inherit;transition:border-color .15s}
.form-input::placeholder{color:#374151}
.form-input:focus{border-color:rgba(74,222,128,.4)}
.form-select{width:100%;background:var(--bg2);border:1px solid rgba(74,222,128,.1);border-radius:8px;padding:8px 10px;font-size:12px;color:var(--text);outline:none;font-family:inherit;appearance:none;cursor:pointer}
.error-box{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);border-radius:12px;padding:10px 14px;font-size:12px;color:#f87171;font-weight:500;margin-bottom:12px}
.success-box{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2);border-radius:12px;padding:10px 14px;font-size:12px;color:var(--green);font-weight:500;margin-bottom:12px}
.modal-footer{text-align:center;font-size:12px;color:var(--dim);margin-top:18px}
.modal-footer button{background:none;border:none;color:var(--green);font-weight:600;cursor:pointer;font-size:12px}

/* ADMIN PANEL */
.admin-header{background:rgba(8,13,10,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.admin-hdr{max-width:1000px;margin:0 auto;padding:0 16px;height:56px;display:flex;align-items:center;gap:10px}
.admin-main{max-width:1000px;margin:0 auto;padding:32px 16px;position:relative;z-index:1}
.admin-title{display:flex;align-items:center;justify-content:space-between;flex-wrap:gap;margin-bottom:24px}
.admin-badge{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.2);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:600;color:#86efac}
.admin-tabs{display:flex;border-bottom:1px solid rgba(255,255,255,.06);margin-bottom:20px}
.atab{padding:12px 18px;font-size:13px;font-weight:600;border:none;background:transparent;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;display:flex;align-items:center;gap:6px}
.atab.active{border-bottom-color:var(--green);color:var(--text)}
.atab-count{padding:2px 6px;border-radius:4px;font-size:11px;font-weight:700}
.atab.active .atab-count{background:rgba(74,222,128,.15);color:var(--green)}
.atab:not(.active) .atab-count{background:rgba(255,255,255,.05);color:var(--muted)}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:8px}
.section-title{font-weight:600;font-size:15px}
.btn-danger-sm{font-size:11px;font-weight:600;padding:6px 10px;border-radius:8px;border:1px solid rgba(239,68,68,.3);background:transparent;color:var(--red);cursor:pointer;display:flex;align-items:center;gap:4px}
.btn-danger-sm:hover{background:rgba(239,68,68,.1)}
.btn-green-sm{font-size:11px;font-weight:700;padding:6px 12px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--green),var(--green2));color:#052e16;cursor:pointer;display:flex;align-items:center;gap:4px}
.action-btns{display:flex;gap:6px}
.add-form{background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:20px;margin-bottom:16px}
.add-form h3{font-size:13px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:6px;color:#86efac}
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.form-grid.cols4{grid-template-columns:repeat(4,1fr)}
.form-grid.cols3{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.form-grid,.form-grid.cols4,.form-grid.cols3{grid-template-columns:1fr 1fr}}
.span2{grid-column:span 2}
.form-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
.btn-cancel{font-size:12px;font-weight:500;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:transparent;color:var(--muted);cursor:pointer}
.btn-confirm{font-size:12px;font-weight:700;padding:8px 14px;border-radius:8px;border:none;background:linear-gradient(135deg,var(--green),var(--green2));color:#052e16;cursor:pointer}
.data-table{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden}
.dt-header{display:grid;padding:10px 16px;border-bottom:1px solid var(--border);font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;text-transform:uppercase}
.dt-row{display:grid;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.03);align-items:center;transition:background .1s}
.dt-row:last-child{border-bottom:none}
.dt-row:hover{background:rgba(255,255,255,.01)}
.dt-players .dt-header,.dt-players .dt-row{grid-template-columns:2fr auto auto 2fr auto}
.dt-admins .dt-header,.dt-admins .dt-row{grid-template-columns:2fr auto auto}
@media(max-width:600px){
  .dt-players .dt-header,.dt-players .dt-row{grid-template-columns:2fr auto auto}
  .dt-hidden{display:none}
}
.cell-player{display:flex;align-items:center;gap:10px}
.mini-avatar{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;flex-shrink:0}
.cell-name{font-size:13px;font-weight:600;color:var(--text)}
.cell-sub{font-size:11px;color:var(--muted)}
.cell-pts{font-weight:700;color:var(--yellow);font-size:13px}
.tier-chips{display:flex;gap:3px;flex-wrap:wrap}
.cell-action{text-align:right}
.btn-remove{font-size:11px;padding:5px 8px;border-radius:6px;border:1px solid rgba(239,68,68,.2);background:transparent;color:var(--red);cursor:pointer;display:inline-flex;align-items:center;gap:3px}
.btn-remove:hover{background:rgba(239,68,68,.15);color:#fff}
.table-empty{text-align:center;padding:48px 20px;color:var(--muted);font-size:13px}
.badge-admin{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.2);color:#86efac}
.badge-super{padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;background:rgba(245,158,11,.1);border:1px solid rgba(245,158,11,.2);color:#fbbf24}
.protected{font-size:11px;color:var(--dim)}
.tiers-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tiers-grid.cols5{grid-template-columns:repeat(5,1fr)}
@media(max-width:600px){.tiers-grid.cols5{grid-template-columns:repeat(3,1fr)}}
.admin-cell-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--green),var(--green2));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#052e16}
.footer-note{text-align:center;font-size:11px;color:var(--dim);padding-top:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const KEYS={users:'vtierlist_users_v2',session:'vtierlist_session_v2',players:'vtierlist_players_v2'};
const GM=['crystal','uhc','axe','pot','sword','smp','nhg','practice','kit'];
const GML={crystal:'Crystal',uhc:'UHC',axe:'Axe',pot:'Pot',sword:'Sword',smp:'SMP',nhg:'NHG',practice:'Practice',kit:'Kit'};
const TIERS=['HT1','HT2','HT3','HT4','HT5','LT1','LT2','LT3','LT4','LT5'];
const TC={HT1:'#dc2626',HT2:'#ea580c',HT3:'#ca8a04',HT4:'#16a34a',HT5:'#2563eb',LT1:'#9333ea',LT2:'#db2777',LT3:'#0891b2',LT4:'#4f46e5',LT5:'#475569'};
const REGIONS=['NA','EU','AS','SA'];
const RC={NA:'#3b82f6',EU:'#6366f1',AS:'#ef4444',SA:'#f59e0b'};
const RTXT={NA:'#fff',EU:'#fff',AS:'#fff',SA:'#000'};

function hsl(str){let h=0;for(let i=0;i<str.length;i++)h=str.charCodeAt(i)+((h<<5)-h);return`hsl(${Math.abs(h)%360},55%,42%)`}
function hsl2(str){let h=0;for(let i=0;i<str.length;i++)h=str.charCodeAt(i+1||0)+((h<<5)-h);return`hsl(${Math.abs(h)%360},45%,35%)`}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

const S={
  getPlayers(){return JSON.parse(localStorage.getItem(KEYS.players)||'[]')},
  savePlayers(p){localStorage.setItem(KEYS.players,JSON.stringify(p))},
  getUsers(){return JSON.parse(localStorage.getItem(KEYS.users)||'[]')},
  saveUsers(u){localStorage.setItem(KEYS.users,JSON.stringify(u))},
  getSession(){return JSON.parse(localStorage.getItem(KEYS.session)||'null')},
  saveSession(s){localStorage.setItem(KEYS.session,JSON.stringify(s))},
};

// Seed admin
(function seedAdmin(){
  const users=S.getUsers();
  const idx=users.findIndex(u=>u.username==='taif');
  if(idx>=0){users[idx].password='zain1234';users[idx].isAdmin=true;}
  else users.unshift({username:'taif',password:'zain1234',isAdmin:true});
  S.saveUsers(users);
})();

let state={
  page:'leaderboard', // 'leaderboard' | 'admin'
  tab:'overall',
  search:'',
  region:'All',
  regionOpen:false,
  loginOpen:false,
  loginMode:'login',
  loginUser:'',loginPass:'',loginErr:'',
  adminTab:'players',
  addPlayerOpen:false,
  ap:{name:'',title:'',points:'0',region:'NA',tiers:{}},
  apErr:'',
  addAdminOpen:false,
  aa:{username:'',password:''},
  aaErr:'',aaOk:'',
  user:S.getSession(),
};

function render(){
  const root=document.getElementById('app');
  root.innerHTML = state.page==='admin' ? renderAdmin() : renderLeaderboard();
  bindEvents();
}

/* ─── LEADERBOARD ─── */
function renderLeaderboard(){
  const players=S.getPlayers();
  const user=state.user;

  let list=[...players];
  if(state.region!=='All') list=list.filter(p=>p.region===state.region);
  if(state.search.trim()) list=list.filter(p=>p.name.toLowerCase().includes(state.search.toLowerCase()));
  if(state.tab!=='overall') list=list.filter(p=>p.tiers&&p.tiers[state.tab]!==undefined);
  list.sort((a,b)=>b.points-a.points);

  const regionCounts={};
  players.forEach(p=>{regionCounts[p.region]=(regionCounts[p.region]||0)+1});

  const tabs=[{key:'overall',label:'Overall'},...GM.map(g=>({key:g,label:GML[g]}))];

  return `
<header>
  <div class="hdr">
    <div class="logo">
      <div class="logo-icon">${slimeSVG()}</div>
      <span class="logo-text">vtierlist</span>
    </div>
    <button class="btn-pill">Rankings</button>
    <div class="spacer"></div>
    <div class="hdr-auth">
      ${user ? `
        ${user.isAdmin?`<button class="btn-admin" data-action="goto-admin">${shieldSVG()} Admin</button>`:''}
        <div class="user-chip">
          <div class="user-avatar">${esc(user.username[0].toUpperCase())}</div>
          <span class="user-name">${esc(user.username)}</span>
        </div>
        <button class="btn-ghost" data-action="logout">${logoutSVG()} Logout</button>
      ` : `
        <button class="btn-ghost" data-action="show-login" data-mode="login">${loginSVG()} Log In</button>
        <button class="btn-primary" data-action="show-login" data-mode="signup">${userPlusSVG()} Sign Up</button>
      `}
    </div>
  </div>
</header>

<main>
  <h1>Leaderboard</h1>
  <p class="subtitle">Competitive Minecraft PvP rankings across all gamemodes.</p>

  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-label">${usersSVG()} Total Players</div>
      <div class="stat-val">${players.length}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">${trophySVG()} Gamemodes</div>

function renderPlayerCard(p,rank){

  return `

  <div class="card-top">
    <div class="rank-badge ${rankClass}">

    </div>

    </div>

      <div class="player-name">${esc(p.name)}</div>

/* ─── EVENT BINDING ─── */
function bindEvents(){
  // Input changes
  document.querySelectorAll('[data-input]').forEach(el=>{
    el.addEventListener('input',e=>{
      const key=e.target.dataset.input;
      if(key==='search'){state.search=e.target.value;render();return;}
      if(key==='loginUser'){state.loginUser=e.target.value;return;}
      if(key==='loginPass'){state.loginPass=e.target.value;return;}
      if(key.startsWith('ap.')){
        const sub=key.slice(3);
        if(sub.startsWith('tier.')){const gm=sub.slice(5);if(e.target.value)state.ap.tiers[gm]=e.target.value;else delete state.ap.tiers[gm];}
        else state.ap[sub]=e.target.value;
        return;
      }
      if(key.startsWith('aa.')){state.aa[key.slice(3)]=e.target.value;return;}
    });
    if(el.tagName==='INPUT'&&el.dataset.input==='search'){
      el.addEventListener('keydown',e=>e.key==='Escape'&&(state.search='',render()));
    }
  });

  // Enter submit for login
  document.querySelectorAll('.modal input').forEach(el=>{
    el.addEventListener('keydown',e=>{if(e.key==='Enter')doSubmitAuth();});
  });
}

document.addEventListener('click',e=>{
  // Close dropdown on outside click
  if(!e.target.closest('.dropdown')){state.regionOpen=false;}

  const btn=e.target.closest('[data-action]');
  if(!btn) return;

  const a=btn.dataset.action;

  if(a==='goto-admin'){if(state.user?.isAdmin){state.page='admin';render();}}
  else if(a==='goto-leaderboard'){state.page='leaderboard';render();}
  else if(a==='set-tab'){state.tab=btn.dataset.tab;render();}
  else if(a==='toggle-region'){state.regionOpen=!state.regionOpen;render();}
  else if(a==='set-region'){state.region=btn.dataset.region;state.regionOpen=false;render();}
  else if(a==='show-login'){state.loginOpen=true;state.loginMode=btn.dataset.mode||'login';state.loginErr='';state.loginUser='';state.loginPass='';render();setTimeout(()=>{const i=document.querySelector('.modal input');if(i)i.focus();},50);}
  else if(a==='close-login'){state.loginOpen=false;render();}
  else if(a==='close-modal-bg'){if(e.target===btn){state.loginOpen=false;render();}}
  else if(a==='set-login-mode'){state.loginMode=btn.dataset.mode;state.loginErr='';render();}
  else if(a==='submit-auth'){doSubmitAuth();}
  else if(a==='logout'){S.saveSession(null);state.user=null;state.page='leaderboard';render();}
  else if(a==='set-atab'){state.adminTab=btn.dataset.atab;state.addPlayerOpen=false;state.addAdminOpen=false;state.aaErr='';state.aaOk='';render();}
  else if(a==='toggle-add-player'){state.addPlayerOpen=!state.addPlayerOpen;state.apErr='';if(!state.addPlayerOpen)state.ap={name:'',title:'',points:'0',region:'NA',tiers:{}};render();}
  else if(a==='confirm-add-player'){doAddPlayer();}
  else if(a==='remove-player'){if(confirm('Remove this player from the leaderboard?')){const p=S.getPlayers().filter(x=>x.id!==btn.dataset.id);S.savePlayers(p);render();}}
  else if(a==='clear-players'){if(confirm('Remove ALL players? This cannot be undone.')){S.savePlayers([]);render();}}
  else if(a==='toggle-add-admin'){state.addAdminOpen=!state.addAdminOpen;state.aaErr='';state.aaOk='';if(!state.addAdminOpen)state.aa={username:'',password:''};render();}
  else if(a==='confirm-add-admin'){doAddAdmin();}
  else if(a==='remove-admin'){if(confirm(`Remove admin rights from ${btn.dataset.username}?`)){const users=S.getUsers();const i=users.findIndex(u=>u.username===btn.dataset.username);if(i>=0){users[i].isAdmin=false;S.saveUsers(users);}render();}}
});

function doSubmitAuth(){
  const username=state.loginUser.trim();
  const password=state.loginPass;
  state.loginErr='';
  if(!username){state.loginErr='Username is required.';render();return;}
  if(!password){state.loginErr='Password is required.';render();return;}
  const users=S.getUsers();
  if(state.loginMode==='login'){
    const u=users.find(x=>x.username.toLowerCase()===username.toLowerCase());
    if(!u||u.password!==password){state.loginErr='Incorrect username or password.';render();return;}
    S.saveSession(u);state.user=u;state.loginOpen=false;render();
  } else {
    if(password.length<6){state.loginErr='Password must be at least 6 characters.';render();return;}
    if(users.find(x=>x.username.toLowerCase()===username.toLowerCase())){state.loginErr='Username already taken.';render();return;}
    const nu={username,password,isAdmin:false};
    users.push(nu);S.saveUsers(users);S.saveSession(nu);state.user=nu;state.loginOpen=false;render();
  }
}

function doAddPlayer(){
  state.apErr='';
  const name=state.ap.name.trim();
  if(!name){state.apErr='Player name is required.';render();return;}
  const color=hsl(name);const color2=hsl2(name);
  const player={
    id:name.toLowerCase().replace(/\s+/g,'-')+'-'+Date.now(),
    name,title:state.ap.title.trim()||'Newcomer',
    titleColor:'#94A3B8',points:parseInt(state.ap.points)||0,
    region:state.ap.region,avatarColor:color,avatarColor2:color2,
    avatarInitial:(name[0]||'?').toUpperCase(),
    tiers:{...state.ap.tiers},
  };
  const players=S.getPlayers();players.push(player);S.savePlayers(players);
  state.ap={name:'',title:'',points:'0',region:'NA',tiers:{}};state.addPlayerOpen=false;render();
}

function doAddAdmin(){
  state.aaErr='';state.aaOk='';
  const username=state.aa.username.trim();
  const password=state.aa.password;
  if(username.length<3){state.aaErr='Username must be at least 3 characters.';render();return;}
  const users=S.getUsers();
  const existing=users.find(u=>u.username.toLowerCase()===username.toLowerCase());
  if(existing){
    if(existing.isAdmin){state.aaErr='This user is already an admin.';render();return;}
    existing.isAdmin=true;S.saveUsers(users);
    state.aaOk=`${existing.username} promoted to admin.`;state.aa={username:'',password:''};render();
  } else {
    if(password.length<6){state.aaErr='Password must be at least 6 characters.';render();return;}
    users.push({username,password,isAdmin:true});S.saveUsers(users);
    state.aaOk=`Admin "${username}" created successfully.`;state.aa={username:'',password:''};render();
  }
}
